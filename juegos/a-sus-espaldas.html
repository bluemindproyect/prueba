<title>A Sus Espaldas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: one phone-width column that fits a play loop on one screen.
   Stage with the three little figures on top, what happened right under it,
   then a compact control deck: where he is / with whom / level tabs / action grid.
   Tú = lamp amber, el otro = rose, él = cold screen blue. Single night look by choice. */
:root {
  color-scheme: dark;
  --night: #17121f;
  --room: #221a2e;
  --raised: #2c2239;
  --line: #3b3049;
  --text: #ece6f2;
  --muted: #a798b8;
  --lamp: #f0b35a;
  --rose: #e88fb0;
  --screen: #86c8ea;
  --danger: #ee7d86;
  --display: "Instrument Serif", Georgia, "Times New Roman", serif;
  --prose: "Literata", Georgia, "Times New Roman", serif;
  --util: "DM Mono", ui-monospace, Menlo, Consolas, monospace;
}
body { background: var(--night); color: var(--text); font-family: var(--prose); font-size: .9375rem; line-height: 1.5; }
.wrap {
  max-width: 30rem; margin: 0 auto;
  padding-block: .9rem 2.5rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: .9rem;
}
header.top { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }
h1 { font-family: var(--display); font-style: italic; font-weight: 400; font-size: 1.5rem; line-height: 1; margin: 0; }
.label { font-family: var(--util); font-weight: 400; font-size: .6875rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0; }
.num { font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }

/* stage */
.stage { background: var(--room); border: 1px solid var(--line); border-radius: .75rem; overflow: hidden; }
.stage svg { display: block; width: 100%; height: auto; }
.f-me { color: var(--lamp); } .f-ot { color: var(--rose); } .f-him { color: var(--screen); }
.stage text { font-family: var(--util); font-size: 8px; letter-spacing: .06em; text-transform: uppercase; fill: var(--muted); text-anchor: middle; }
.pop { animation: pop .45s ease both; transform-box: fill-box; transform-origin: center bottom; }
.float { animation: float 1.8s ease-in-out infinite alternate; }
@keyframes pop { from { transform: scale(.85); opacity: .3; } to { transform: none; opacity: 1; } }
@keyframes float { from { transform: translateY(0); } to { transform: translateY(-4px); } }
.what { padding: .7rem .85rem .85rem; display: flex; flex-direction: column; gap: .45rem; border-top: 1px solid var(--line); }
.what p { margin: 0; }
.thought { font-family: var(--display); font-style: italic; font-size: 1.3rem; line-height: 1.15; color: var(--lamp); text-wrap: balance; }
.chips { display: flex; flex-wrap: wrap; gap: .3rem; }
.chip { font-family: var(--util); font-size: .625rem; letter-spacing: .04em; border: 1px solid var(--line); border-radius: 1rem; padding: .05rem .5rem; color: var(--muted); }
.chip.up { color: var(--lamp); border-color: var(--lamp); }
.chip.him { color: var(--screen); border-color: var(--screen); }
.chip.bad { color: var(--danger); border-color: var(--danger); }
.note { font-family: var(--util); font-size: .75rem; color: var(--lamp); }
.follow { display: flex; flex-direction: column; gap: .35rem; margin-top: .15rem; }
.follow-row { display: flex; flex-wrap: wrap; gap: .35rem; }
.fbtn { background: var(--raised); border: 1px solid var(--rose); color: var(--rose); border-radius: 1rem; padding: .3rem .7rem; cursor: pointer; font-size: .875rem; text-align: left; }
.fbtn small { font-family: var(--util); font-size: .625rem; color: var(--muted); margin-left: .35rem; }

/* status */
.status { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: .6rem .9rem; }
.status > div { min-width: 0; display: flex; flex-direction: column; gap: .3rem; }
.row { display: flex; justify-content: space-between; align-items: baseline; gap: .5rem; }
.lvl { font-family: var(--display); font-size: 1.4rem; line-height: 1; color: var(--lamp); }
.bar { height: .35rem; background: var(--room); border: 1px solid var(--line); border-radius: 1rem; overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 1rem; background: var(--lamp); transition: width .4s ease; }
.his .bar i { background: var(--screen); }
.his input { font-family: var(--display); font-size: 1.15rem; line-height: 1; color: var(--text); background: transparent; border: none; border-bottom: 1px dashed var(--line); padding: 0; width: 6.5rem; min-width: 0; }
.state { font-family: var(--util); font-size: .625rem; letter-spacing: .08em; text-transform: uppercase; color: var(--screen); white-space: nowrap; }
.mini { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: .15rem .4rem; align-items: center; }
.recs { display: flex; flex-wrap: wrap; gap: .15rem .7rem; font-family: var(--util); font-size: .6875rem; color: var(--muted); margin: 0; }
.recs b { color: var(--text); font-weight: 500; }

/* deck */
.deck { display: flex; flex-direction: column; gap: .55rem; border-top: 1px solid var(--line); padding-top: .8rem; }
.seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .3rem; }
.seg button, .tabs button, .who button { background: transparent; border: 1px solid var(--line); border-radius: .45rem; padding: .4rem .3rem; cursor: pointer; min-width: 0; }
.seg button small { display: block; font-family: var(--util); font-size: .5625rem; color: var(--muted); }
[aria-pressed="true"] { border-color: var(--lamp) !important; color: var(--lamp); background: var(--raised) !important; }
.who { display: flex; gap: .3rem; overflow-x: auto; padding-bottom: .2rem; scrollbar-width: none; }
.who::-webkit-scrollbar { display: none; }
.who button { white-space: nowrap; flex: none; padding: .35rem .65rem; border-radius: 1rem; }
.who [aria-pressed="true"] { border-color: var(--rose) !important; color: var(--rose); }
.tabs { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: .25rem; }
.tabs button { font-family: var(--util); font-size: .75rem; padding: .3rem 0; }
.tabs button:disabled { color: var(--line); border-style: dashed; cursor: not-allowed; }
.acts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .35rem; }
.act { background: var(--room); border: 1px solid var(--line); border-radius: .5rem; padding: .55rem .65rem; cursor: pointer; text-align: left; min-width: 0; display: flex; flex-direction: column; gap: .15rem; line-height: 1.25; }
.act:hover { border-color: var(--lamp); }
.act:active { transform: scale(.98); }
.act small { font-family: var(--util); font-size: .625rem; color: var(--muted); }
details { border-top: 1px solid var(--line); padding-top: .7rem; }
summary { cursor: pointer; }
ol.log { margin: .6rem 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: .35rem; font-size: .875rem; color: var(--muted); }
.ghost { font-family: var(--util); font-size: .6875rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); background: none; border: none; padding: .25rem 0; cursor: pointer; align-self: flex-start; }
footer { font-size: .75rem; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .pop, .float { animation: none; } .bar i { transition: none; } }
</style>

<div class="wrap">
  <header class="top">
    <h1>A Sus Espaldas</h1>
    <span class="label num" id="turn">Día 1</span>
  </header>

  <section class="stage" aria-label="Escena">
    <div id="scene"></div>
    <div class="what" id="what" aria-live="polite"></div>
  </section>

  <section class="status" aria-label="Marcadores">
    <div class="me">
      <div class="row"><span class="label">Satisfacción</span><span class="lvl num" id="level"></span></div>
      <div class="bar"><i id="satBar"></i></div>
      <span class="label num" id="satText" style="text-transform:none;letter-spacing:0"></span>
      <p class="recs num" id="recs"></p>
    </div>
    <div class="his">
      <div class="row">
        <input id="hisName" type="text" maxlength="14" autocomplete="off" aria-label="Nombre de él">
        <span class="state" id="hisState"></span>
      </div>
      <div class="mini">
        <span class="label">Conf</span><div class="bar"><i id="bC"></i></div>
        <span class="label">Sosp</span><div class="bar"><i id="bS"></i></div>
        <span class="label">Humi</span><div class="bar"><i id="bH"></i></div>
      </div>
    </div>
  </section>

  <section class="deck" aria-label="Tu jugada">
    <div class="seg" id="modes"></div>
    <div class="who" id="targets"></div>
    <div class="tabs" id="tabs"></div>
    <div class="acts" id="acts"></div>
  </section>

  <details>
    <summary class="label">Historial</summary>
    <ol class="log" id="log"></ol>
  </details>
  <button class="ghost" id="reset" type="button">Borrar todo y empezar de cero</button>
  <footer>Juego de ficción. Todos los personajes son adultos e inventados.</footer>
</div>

    }
    if (o.sweat) g += '<path d="M14 ' + (-60 + hd) + ' q3 5 0 7 q-3 -2 0 -7z" fill="currentColor" stroke="none"/>';
    if (o.mark) g += '<text x="0" y="' + (-66 + hd) + '" style="font-size:13px;fill:currentColor" stroke="none">' + o.mark + '</text>';
    // El grupo de afuera lleva la posición; el de adentro, la animación (si no, el CSS pisa el transform).
    return '<g transform="translate(' + x + ',108) scale(' + (o.s || 1) + ')"><g class="' + cls + (o.pop ? ' pop' : '') + '" style="opacity:' + (o.op || 1) + '" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"' + (o.dash ? ' stroke-dasharray="3 4"' : '') + '>' + g + '</g></g>';
  }
  function heart(x, y, s) {
    return '<g transform="translate(' + x + ',' + y + ') scale(' + s + ')"><path class="float" d="M0 4 C-6 -5 -13 2 0 13 C13 2 6 -5 0 4Z" fill="var(--rose)"/></g>';
  }
  function label(x, t) { return '<text x="' + x + '" y="123">' + esc(t) + '</text>'; }

  function drawScene() {
    var r = S.last, svg = '<line x1="12" y1="108" x2="308" y2="108" stroke="var(--line)" stroke-width="1.5"/>';
    var name = S.name || 'él';
    if (!r || !r.aid) {
      var st = stage();
      svg += fig(140, 'f-me', { face: 'smile' }) + fig(180, 'f-him', { face: st < 1 ? 'smile' : st < 3 ? 'flat' : 'frown', s: [1, .97, .92, .86, .78][st], hd: [0, 1, 3, 6, 8][st], slump: st >= 3 });
      svg += label(140, 'tú') + label(180, name);
    } else {
      var a = find(ACTS, r.aid), t = find(TARGETS, r.tid), m = r.mode, st2 = r.stage || 0;
      var hx;
      if (a.priv) {
        svg += '<g class="pop"><rect x="112" y="34" width="56" height="74" rx="3" fill="var(--raised)" stroke="var(--line)" stroke-width="2"/><circle cx="158" cy="74" r="2.5" fill="var(--lamp)"/></g>';
        svg += heart(128, 12, .8) + heart(150, 6, 1.1);
        svg += label(140, 'tú + ' + t.tag);
        hx = m === 'frente' ? 210 : 268;
      } else {
        var gap = a.lvl >= 2 ? 13 : 24;
        svg += fig(138 - gap, 'f-me', { face: 'smile', reach: 1, pop: true }) + fig(138 + gap, 'f-ot', { face: 'smile', reach: -1, pop: true });
        svg += heart(138, a.lvl >= 2 ? 22 : 28, a.lvl >= 3 ? 1.2 : a.lvl >= 2 ? .9 : .6);
        svg += label(138 - gap - 8, 'tú') + label(138 + gap + 14, t.tag);
        hx = m === 'frente' ? 222 : 272;
      }
      var mood = { s: [1, .97, .92, .86, .78][st2], hd: [0, 1, 3, 6, 8][st2], slump: st2 >= 3, sweat: st2 >= 2, face: st2 < 1 ? 'flat' : 'frown' };
      if (m === 'ausente') { svg += fig(hx, 'f-him', { dash: true, op: .35 }); svg += label(hx, 'no está'); }
      else if (m === 'cerca' && !r.seen) { svg += fig(hx, 'f-him', {}); svg += label(hx, name + ' · de espaldas'); }
      else if (m === 'cerca') { mood.mark = '?'; mood.pop = true; svg += fig(hx, 'f-him', mood); svg += label(hx, name + ' · vio algo'); }
      else { mood.mark = st2 >= 3 ? '…' : '!'; mood.pop = true; svg += fig(hx, 'f-him', mood); svg += label(hx, name); }
    }
    $('scene').innerHTML = '<svg viewBox="0 0 320 130" role="img" aria-label="Escena con los personajes">' + svg + '</svg>';
  }

  /* ---------- jugada ---------- */
  function followUps(a, lv) {
    var ups = ACTS.filter(function (x) { return x.lvl <= lv && x.id !== a.id && x.sat > a.sat; }).slice(0, 3);
    if (ups.length < 2) {
      var pool = ACTS.filter(function (x) { return x.lvl <= lv && x.lvl >= lv - 1 && x.id !== a.id && ups.indexOf(x) < 0; });
      while (ups.length < 3 && pool.length) ups.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
    }
    return ups.map(function (x) { return x.id; });
  }

  function play(aid, chained) {
    var a = find(ACTS, aid), t = find(TARGETS, S.pick.target), m = S.pick.mode;
    var before = level();
    if (!a || !t || a.lvl > before) return;
    var n = chained ? S.combo + 1 : 0;
    if (!chained && S.cheat > 0) S.turn++;
    var stale = a.lvl < before - 1;
    var base = a.sat * t.ms * (stale ? 0.5 : 1) * (1 + 0.15 * n);
    var r = { chips: [], seen: false, aid: a.id, tid: t.id, mode: m };
    var short = fill(a.txt, t);
    var line = short + '. ' + fill(a.det, t);
    var gain, thought, dh = 0, dc = 0, ds = 0, alive = true;

    S.cheat++;
    if (m === 'ausente') {
      gain = base; S.away++; S.streak++;
      line += ' ' + fill('{n} no está. No se entera de nada.');
      thought = pickOne((t.th || []).concat(THOUGHTS.ausente));
    } else if (m === 'cerca') {
      if (Math.random() * 100 < risk(a, n)) {
        gain = base * 1.2; r.seen = true; alive = false;
        S.seen++; S.streak = 0;
        ds = 15; dh = a.hum * t.mh * 0.6; dc = -8;
        line += ' ' + fill('{n} voltea justo a tiempo para ver algo. No sabe bien qué vio, pero lo vio.');
        thought = pickOne(THOUGHTS.visto);
      } else {
        gain = base * 1.5; S.away++; S.streak++;
        line += ' ' + fill('{n} está a unos metros, de espaldas. No voltea.');
        thought = pickOne((t.th || []).concat(THOUGHTS.ok));
      }
    } else {
      gain = base * 2; r.seen = true;
      S.seen++; S.streak = 0;
      dh = a.hum * t.mh; dc = -dh / 2; ds = 10;
      if (a.priv) line += ' ' + fill('{n} se queda afuera. Sabe exactamente qué está pasando.');
      else line = fill('Con {n} viendo: ') + line.charAt(0).toLowerCase() + line.slice(1);
      line += ' ' + fill(pickOne(REACT[stage()]));
      thought = pickOne(THOUGHTS.frente);
    }
    if (n >= 2 && alive && Math.random() < 0.5) thought = pickOne(THOUGHTS.combo);
    gain = Math.max(1, Math.round(gain));
    S.sat += gain;
    if (S.streak > S.best) S.best = S.streak;
    S.combo = alive ? n : 0;
    if (n + 1 > S.bestCombo) S.bestCombo = n + 1;
    var h0 = S.h, c0 = S.c, s0 = S.s, st0 = stage();
    S.h = clamp(S.h + dh); S.c = clamp(S.c + dc); S.s = clamp(S.s + ds);
    r.stage = stage();

    r.chips.push(['+' + gain + ' satisfacción', 'up']);
    if (n > 0) r.chips.push(['combo ×' + (n + 1), 'up']);
    if (!r.seen) r.chips.push(['te saliste con la tuya', 'up']);
    if (stale) r.chips.push(['esto ya no te llena', '']);
    if (S.h !== h0) r.chips.push(['humillación +' + (S.h - h0), 'him']);
    if (S.c !== c0) r.chips.push(['confianza ' + (S.c - c0), 'him']);
    if (S.s !== s0) r.chips.push(['sospecha +' + (S.s - s0), 'bad']);
    if (m === 'ausente') r.chips.push(['sin efecto en él', '']);

    r.line = line; r.thought = thought;
    var after = level();
    r.notes = [];
    if (r.stage > st0) r.notes.push(fill('{n} cambió. Ahora está: ') + STATES[r.stage].toLowerCase() + '.');
    if (after > before) { r.notes.push('Nivel ' + after + '. Lo de antes ya no alcanza: hay acciones nuevas.'); S.tab = after; }
    if (!alive) r.notes.push('Te vio. Se cortó el combo.');
    r.follow = alive ? followUps(a, after) : [];

    S.last = r;
    var how = m === 'ausente' ? 'él no estaba' : m === 'frente' ? 'frente a él' : r.seen ? 'él cerca, te vio' : 'él cerca, no te vio';
    S.log.unshift('Día ' + S.turn + ' · ' + short + ' (' + how + ').');
    if (S.log.length > 40) S.log.length = 40;
    save(); render();
    window.scrollTo(0, 0);
  }

  function setPick(key, id) {
    S.pick[key] = id; S.combo = 0;
    if (S.last) S.last.follow = [];
    save(); render();
  }

  function render() {
    var lv = level(), next = LEVELS[lv], prev = LEVELS[lv - 1];
    if (!S.tab || S.tab > lv) S.tab = lv;
    $('turn').textContent = 'Día ' + S.turn;
    $('level').textContent = 'Nv ' + lv;
    $('satText').textContent = next ? S.sat + ' / ' + next + ' para nivel ' + (lv + 1) : S.sat + ' · nivel máximo';
    $('satBar').style.width = (next ? Math.round((S.sat - prev) / (next - prev) * 100) : 100) + '%';
    var recs = $('recs'); recs.textContent = '';
    [['engaños', S.cheat], ['impunes', S.away], ['racha', S.best], ['combo', S.bestCombo], ['te vio', S.seen]].forEach(function (x) {
      var s = el('span'); s.appendChild(el('b', null, String(x[1]))); s.appendChild(document.createTextNode(' ' + x[0])); recs.appendChild(s);
    });
    if (document.activeElement !== $('hisName')) $('hisName').value = S.name;
    $('hisState').textContent = STATES[stage()];
    $('bC').style.width = S.c + '%'; $('bS').style.width = S.s + '%'; $('bH').style.width = S.h + '%';

    drawScene();

    var what = $('what'); what.textContent = '';
    var r = S.last;
    if (!r) {
      what.appendChild(el('p', null, 'Todavía no has hecho nada. ' + (S.name || 'Él') + ' confía en ti por completo.'));
      what.appendChild(el('p', 'label', 'Elige dónde está él, con quién, y toca una acción.'));
    } else {
      what.appendChild(el('p', null, r.line));
      what.appendChild(el('p', 'thought', r.thought));
      var chips = el('div', 'chips');
      r.chips.forEach(function (c) { chips.appendChild(el('span', 'chip ' + c[1], c[0])); });
      what.appendChild(chips);
      (r.notes || []).forEach(function (t) { what.appendChild(el('p', 'note', t)); });
      if (r.follow && r.follow.length) {
        var f = el('div', 'follow');
        f.appendChild(el('span', 'label', 'Y luego… (combo ×' + (S.combo + 2) + ')'));
        var row = el('div', 'follow-row');
        r.follow.forEach(function (id) {
          var a = find(ACTS, id); if (!a) return;
          var b = el('button', 'fbtn', a.label); b.type = 'button';
          if (S.pick.mode === 'cerca') b.appendChild(el('small', 'num', risk(a, S.combo + 1) + '%'));
          b.addEventListener('click', function () { play(id, true); });
          row.appendChild(b);
        });
        f.appendChild(row); what.appendChild(f);
      }
    }

    var modes = $('modes'); modes.textContent = '';
    MODES.forEach(function (o) {
      var b = el('button', null, o.label); b.type = 'button'; b.appendChild(el('small', null, o.sub));
      b.setAttribute('aria-pressed', String(S.pick.mode === o.id));
      b.addEventListener('click', function () { setPick('mode', o.id); });
      modes.appendChild(b);
    });
    var who = $('targets'); who.textContent = '';
    TARGETS.forEach(function (o) {
      var b = el('button', null, o.label); b.type = 'button';
      b.setAttribute('aria-pressed', String(S.pick.target === o.id));
      b.addEventListener('click', function () { setPick('target', o.id); });
      who.appendChild(b);
    });
    var tabs = $('tabs'); tabs.textContent = '';
    for (var i = 1; i <= LEVELS.length; i++) (function (n) {
      var b = el('button', 'num', 'N' + n); b.type = 'button';
      b.disabled = n > lv;
      b.setAttribute('aria-pressed', String(S.tab === n));
      b.setAttribute('aria-label', 'Acciones de nivel ' + n + (n > lv ? ' (bloqueado)' : ''));
      b.addEventListener('click', function () { S.tab = n; save(); render(); });
      tabs.appendChild(b);
    })(i);
    var acts = $('acts'); acts.textContent = '';
    ACTS.filter(function (a) { return a.lvl === S.tab; }).forEach(function (a) {
      var b = el('button', 'act'); b.type = 'button';
      b.appendChild(el('span', null, a.label));
      var tag = a.lvl < lv - 1 ? 'ya no te llena' : S.pick.mode === 'cerca' ? 'riesgo ' + risk(a, 0) + '%' : '+' + Math.round(a.sat * find(TARGETS, S.pick.target).ms * (S.pick.mode === 'frente' ? 2 : 1));
      b.appendChild(el('small', 'num', tag));
      b.addEventListener('click', function () { play(a.id, false); });
      acts.appendChild(b);
    });

    var log = $('log'); log.textContent = '';
    if (!S.log.length) log.appendChild(el('li', null, 'Vacío por ahora.'));
    S.log.forEach(function (l) { log.appendChild(el('li', null, l)); });
  }

  $('hisName').addEventListener('input', function (e) { S.name = e.target.value.trim() || 'él'; save(); });
  $('hisName').addEventListener('blur', render);
  var armed = false;
  $('reset').addEventListener('click', function () {
    if (!armed) { armed = true; this.textContent = 'Toca otra vez para confirmar'; return; }
    armed = false; this.textContent = 'Borrar todo y empezar de cero';
    S = fresh(); save(); render(); window.scrollTo(0, 0);
  });

  function start(data) {
    var saved = data && data.S;
    if (!saved) { try { saved = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { saved = null; } }
    if (saved && typeof saved.sat === 'number') {
      var f = fresh();
      for (var k in saved) f[k] = saved[k];
      f.pick = { mode: (saved.pick && saved.pick.mode) || 'ausente', target: (saved.pick && saved.pick.target) || 'desc' };
      if (f.last && !f.last.aid) f.last = null;
      S = f;
    }
    render();
  }
  var hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) hot.snapshot(function () { return { S: S }; });
  if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
