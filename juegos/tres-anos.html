<title>Tres Años</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: one narrow reading column, like a page of a novel lit by a lamp.
   The whole room changes temperature when the point of view changes:
   warm lamp light for "tú", cold screen light for "ella". Single night look by choice. */
:root {
  color-scheme: dark;
  --night: #17121f;
  --room: #221a2e;
  --line: #3b3049;
  --text: #ece6f2;
  --muted: #a798b8;
  --lamp: #f0b35a;
  --screen: #86c8ea;
  --accent: var(--lamp);
  --bubble-in: #2e2540;
  --display: "Instrument Serif", Georgia, "Times New Roman", serif;
  --prose: "Literata", Georgia, "Times New Roman", serif;
  --util: "DM Mono", ui-monospace, Menlo, Consolas, monospace;
}
:root[data-pov="ella"] {
  --night: #101924;
  --room: #172432;
  --line: #2b3c4e;
  --muted: #93a8ba;
  --accent: var(--screen);
  --bubble-in: #1f3042;
}
html, body { min-height: 100%; }
body {
  background: var(--night);
  color: var(--text);
  font-family: var(--prose);
  font-size: 1.0625rem;
  line-height: 1.65;
  transition: background-color .9s ease;
}
.wrap {
  max-width: 34rem;
  margin: 0 auto;
  padding-block: 1.5rem 3rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
}
header.top {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 1rem;
  border-bottom: 1px solid var(--line);
  padding-bottom: .75rem;
}
.game-name {
  font-family: var(--display);
  font-style: italic;
  font-size: 1.5rem;
  line-height: 1;
  margin: 0;
  font-weight: 400;
}
.clock {
  font-family: var(--util);
  font-size: .75rem;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.pov {
  font-family: var(--util);
  font-size: .75rem;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--accent);
  margin: 0;
}
h2.scene-title {
  font-family: var(--display);
  font-weight: 400;
  font-size: clamp(2.25rem, 9vw, 3.25rem);
  line-height: 1.02;
  margin: .25rem 0 0;
  text-wrap: balance;
}
.scene { display: flex; flex-direction: column; gap: 1.1rem; }
.scene p { margin: 0; }
.scene p.reaction { color: var(--muted); font-style: italic; }
.scene > * { animation: rise .5s ease both; }
.scene > *:nth-child(2) { animation-delay: .06s; }
.scene > *:nth-child(3) { animation-delay: .12s; }
.scene > *:nth-child(4) { animation-delay: .18s; }
.scene > *:nth-child(n+5) { animation-delay: .24s; }
@keyframes rise { from { opacity: .0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  .scene > * { animation: none; }
  body { transition: none; }
}

/* phone */
.phone {
  background: var(--room);
  border: 1px solid var(--line);
  border-radius: 1.25rem;
  padding: .9rem;
  display: flex;
  flex-direction: column;
  gap: .5rem;
  max-width: 21rem;
  width: 100%;
  align-self: center;
}
.phone-head {
  font-family: var(--util);
  font-size: .75rem;
  color: var(--muted);
  display: flex;
  justify-content: space-between;
  gap: .5rem;
  padding-bottom: .4rem;
  border-bottom: 1px solid var(--line);
}
.phone-head strong { color: var(--text); font-weight: 500; }
.bubble {
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: .9375rem;
  line-height: 1.35;
  padding: .5rem .75rem;
  border-radius: 1rem;
  max-width: 85%;
  overflow-wrap: anywhere;
}
.bubble.in { background: var(--bubble-in); align-self: flex-start; border-bottom-left-radius: .3rem; }
.bubble.out { background: var(--screen); color: #0d1a24; align-self: flex-end; border-bottom-right-radius: .3rem; }
.bubble.new { outline: 1px solid var(--screen); outline-offset: 2px; }

/* choices */
.choices { display: flex; flex-direction: column; gap: .6rem; margin-top: .4rem; }
button.choice {
  font: inherit;
  font-size: 1rem;
  line-height: 1.4;
  text-align: left;
  color: var(--text);
  background: transparent;
  border: 1px solid var(--line);
  border-radius: .5rem;
  padding: .8rem 1rem;
  cursor: pointer;
  transition: border-color .15s, background-color .15s;
}
button.choice:hover { border-color: var(--accent); background: var(--room); }
button.choice:focus-visible, button.ghost:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.choice.go { border-color: var(--accent); color: var(--accent); text-align: center; }

/* ending */
.meters { display: flex; flex-direction: column; gap: 1rem; margin: 0; padding: 0; list-style: none; }
.meter-row { display: flex; justify-content: space-between; gap: 1rem; font-family: var(--util); font-size: .8125rem; letter-spacing: .06em; text-transform: uppercase; }
.meter-row span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: .5rem; background: var(--room); border: 1px solid var(--line); border-radius: 1rem; overflow: hidden; margin-top: .35rem; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 1rem; }
.meter-note { font-size: .9375rem; color: var(--muted); margin: .35rem 0 0; }
.verdict { font-family: var(--display); font-size: 1.75rem; line-height: 1.15; text-wrap: balance; }
h3.sub { font-family: var(--util); font-weight: 400; font-size: .75rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: .5rem 0 0; }
ul.memory { margin: 0; padding-left: 1.1rem; display: flex; flex-direction: column; gap: .4rem; }
button.ghost {
  font-family: var(--util);
  font-size: .75rem;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--muted);
  background: none;
  border: none;
  padding: .25rem 0;
  cursor: pointer;
  align-self: flex-start;
}
button.ghost:hover { color: var(--text); }
footer.note { font-size: .875rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: .9rem; }
</style>

<div class="wrap">
  <header class="top">
    <h1 class="game-name">Tres Años</h1>
    <span class="clock" id="clock">Jueves · 21:40</span>
  </header>
  <main class="scene" id="scene" aria-live="polite"></main>
  <button class="ghost" id="restart" type="button">Empezar de nuevo</button>
  <footer class="note">Escena 1 de una historia de ficción. Todos los personajes son adultos e inventados.</footer>
</div>

<script>
(function () {
  var KEY = 'tres-anos-v1';

  function fresh() {
    return { node: 'n1', m: { c: 8, s: 1, h: 0 }, flags: {}, log: [], reaction: '', chat: [
      { who: 'in', t: '¿Ya llegaste a tu casa?' },
      { who: 'in', t: 'Sigo pensando en lo del elevador.' }
    ], fresh: 2 };
  }
  var S = fresh();

  function clamp(n) { return Math.max(0, Math.min(10, n)); }
  function apply(d) {
    if (!d) return;
    S.m.c = clamp(S.m.c + (d.c || 0));
    S.m.s = clamp(S.m.s + (d.s || 0));
    S.m.h = clamp(S.m.h + (d.h || 0));
  }

  var NODES = {
    n1: {
      pov: 'tu', time: 'Jueves · 21:40', title: 'La cena', phone: true,
      text: function () { return [
        'Llegas cuarenta minutos tarde. El departamento huele a ajo y a vino tinto, y la mesa tiene el mantel que solo sale del cajón un par de veces al año.',
        'Mariana trae puesto un vestido verde. Te sirve sin preguntar por qué llegaste tarde y se sienta frente a ti.',
        'Apenas levantas el tenedor, tu teléfono vibra contra la madera.'
      ]; },
      choices: [
        { label: 'Voltear el teléfono boca abajo y seguir cenando', d: { s: 1 },
          log: 'Volteaste el teléfono para que no viera la pantalla.',
          re: 'Lo volteas sin leer. Mariana sigue el movimiento con los ojos, un segundo nada más, y vuelve a su plato.' },
        { label: 'Contestar ahí mismo, en la mesa', d: { s: 2, h: 1 }, out: 'Ya llegué. Yo también.',
          log: 'Sonreíste al teléfono mientras ella te servía.',
          re: 'Escribes con una mano. No te das cuenta de que estás sonriendo hasta que levantas la vista. Mariana ya está viendo hacia otro lado, con la copa detenida a medio camino.' },
        { label: 'Decir «es del trabajo» y salir a contestar al balcón', d: { s: 1, c: -1, h: 1 }, out: 'Ya llegué. Yo también.',
          log: 'La dejaste sola en la mesa para contestar afuera.',
          re: 'Cierras la puerta corrediza detrás de ti. Desde afuera la ves a través del vidrio: sentada derecha, sola frente a dos platos, esperando para empezar.' }
      ], next: 'n2'
    },
    n2: {
      pov: 'tu', time: 'Jueves · 21:52', title: 'La pregunta',
      text: function () { return [
        '—¿Quién era? —pregunta Mariana.',
        'No lo dice con reclamo. Lo dice como quien pregunta la hora.'
      ]; },
      choices: [
        { label: 'Mentir: «Rodrigo, por el reporte de mañana»', flag: 'lied',
          log: 'Le dijiste que era Rodrigo.',
          re: '—Ah —dice—. Pobre Rodrigo, a estas horas. Te cree. O decide creerte, que desde donde estás sentado se ve igual.' },
        { label: 'Voltearlo contra ella: «¿Ahora me vas a revisar el teléfono?»', d: { h: 2, c: -1 }, flag: 'mock',
          log: 'Se disculpó contigo por haber preguntado.',
          re: 'Mariana parpadea. —No, perdón. Nada más preguntaba. La que se disculpa es ella. Acomoda su servilleta, que no estaba desacomodada.' },
        { label: 'Media verdad: «Valeria, de la oficina. Nada importante»', d: { s: 2 }, flag: 'named',
          log: 'Escuchó el nombre de Valeria por primera vez.',
          re: '—Valeria —repite despacio, como si se probara el nombre—. No me habías hablado de ella. —No hay nada que hablar. Asiente. El nombre se queda en la mesa, junto al pan.' }
      ], next: 'n3'
    },
    n3: {
      pov: 'tu', time: 'Jueves · 22:05', title: 'La pasta',
      text: function () { return [
        'Mariana gira su plato un poco hacia ti.',
        '—¿Te acuerdas de esta? Es la pasta del lugar de la calle Sexta. La de la primera vez.',
        'Hace una pausa. —Hoy son tres años.'
      ]; },
      choices: [
        { label: 'Admitirlo: «Se me pasó. Perdón»', d: { c: -1, h: 1 },
          log: 'Olvidaste el aniversario y ella te inventó la excusa.',
          re: '—No pasa nada —dice rápido, demasiado rápido—. Tuviste un día pesado. Te inventa la excusa ella sola, para que no tengas que inventarla tú.' },
        { label: 'Fingir: «Claro que sé. Por eso quise llegar temprano»', d: { h: 1, s: 1, c: -1 },
          log: 'Dijiste que llegaste temprano. Ella había visto el reloj.',
          re: 'Llegaste cuarenta minutos tarde y los dos lo saben. Mariana sonríe de todos modos. Es una sonrisa chiquita y bien educada, la que usa con la gente que no conoce.' },
        { label: 'Decir «está muy rica» sin despegar los ojos de la pantalla', d: { h: 2, c: -1 },
          log: 'La felicitaste por la cena sin voltear a verla.',
          re: '—Gracias —dice. Espera un momento a que levantes la cara. No la levantas. Empieza a comer en silencio, con bocados pequeños, como una invitada en su propia mesa.' }
      ], next: 'n4'
    },
    n4: {
      pov: 'tu', time: 'Jueves · 22:20', title: 'La pantalla', phone: true,
      incoming: ['¿Mañana comemos otra vez? Yo invito 😉'],
      text: function () { return [
        'El teléfono vuelve a vibrar. Esta vez se desliza unos centímetros sobre el mantel, hacia el lado de Mariana, y la pantalla le queda más cerca a ella que a ti.'
      ]; },
      choices: [
        { label: 'No moverte. Dejar que lo lea', d: { h: 2, s: 3 }, flag: 'saw',
          log: 'Leyó el mensaje de Valeria y te devolvió el teléfono.',
          re: 'No estiras la mano. Mariana baja la vista y la deja ahí lo que se tarda en leer una línea corta. Luego empuja el teléfono hacia ti con dos dedos, con cuidado, como se devuelve algo ajeno. —Te buscan —dice.' },
        { label: 'Agarrarlo rápido y guardarlo en la bolsa', d: { s: 2, h: 1 },
          log: 'Escondiste el teléfono tan rápido que tembló la copa.',
          re: 'Lo alcanzas antes que su mirada, o eso crees. El movimiento te sale más brusco de lo que querías y tu copa tiembla. —Tranquilo —dice Mariana—. No lo iba a tocar.' },
        { label: 'Contestar que sí, frente a ella', d: { h: 3, s: 3, c: -1 }, flag: 'saw', out: 'Sí. Mismo lugar.',
          log: 'Aceptaste la comida con Valeria frente a ella.',
          re: 'Escribes la respuesta con el teléfono todavía sobre la mesa, a la vista. Mariana lee de cabeza; siempre ha sido buena para eso. Dobla su servilleta en cuatro, luego en ocho. —¿Quieres postre? —pregunta—. Hice.' }
      ], next: 'n5'
    },
    n5: {
      pov: 'ella', time: 'Jueves · 23:10', title: 'Mariana',
      text: function () {
        var f = S.flags, p = [
          'Lava los platos ella. Tú dijiste que estabas cansado y ella dijo que sí, que claro.',
          'El vestido verde lo compró hace dos semanas. Se lo probó tres veces frente al espejo antes de decidirse. Con las manos en el agua caliente se da cuenta de que no dijiste nada sobre él.'
        ];
        if (f.lied) p.push('Rodrigo salió de vacaciones el lunes. Ella misma le dio like a la foto de la playa. No sabe qué le pesa más: que le mientas, o que te parezca tan fácil engañarla.');
        if (f.mock) p.push('«Perdón», te dijo. Repasa la palabra y no encuentra de qué se disculpó. Aun así sabe que la próxima vez no va a preguntar.');
        if (f.named) p.push('Valeria. Lo dice sin voz, moviendo apenas la boca. Ahora ya tiene nombre, y eso es peor que no saber.');
        if (f.saw) p.push('«Otra vez». El mensaje decía otra vez. Hace la cuenta de las veces que comiste «con el equipo» este mes y deja de contar en la cuarta.');
        else p.push('No alcanzó a leer nada. Lo que sí vio fue tu mano, lo rápido que se movió. Nadie cuida así un mensaje del trabajo.');
        if (S.m.h >= 7) p.push('El postre sigue en el refrigerador, intacto. Mañana lo va a tirar antes de que despiertes, para que nadie tenga que mencionarlo.');
        else if (S.m.h >= 4) p.push('Guarda el mantel en su cajón, bien doblado. Se tarda más de lo necesario.');
        else p.push('Apaga la luz de la cocina y se queda un momento ahí, a oscuras, decidiendo que seguro no fue nada.');
        return p;
      },
      choices: [ { label: 'Ver lo que dejó la noche', go: true } ], next: 'end'
    }
  };

  function el(tag, cls, txt) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (txt != null) e.textContent = txt;
    return e;
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  }

  function choose(node, ch) {
    apply(ch.d);
    if (ch.flag) S.flags[ch.flag] = true;
    if (ch.log) S.log.push(ch.log);
    if (ch.out) S.chat.push({ who: 'out', t: ch.out });
    S.reaction = ch.re || '';
    S.fresh = 0;
    S.node = node.next;
    var nx = NODES[S.node];
    if (nx && nx.incoming) {
      nx.incoming.forEach(function (t) { S.chat.push({ who: 'in', t: t }); });
      S.fresh = nx.incoming.length;
    }
    if (S.node === 'n5' && S.flags.lied) apply({ c: -2, s: 2, h: 1 });
    save();
    render();
    window.scrollTo(0, 0);
  }

  function phone() {
    var box = el('div', 'phone');
    var head = el('div', 'phone-head');
    var name = el('strong', null, 'Valeria');
    head.appendChild(name);
    head.appendChild(el('span', null, 'ahora'));
    box.appendChild(head);
    S.chat.forEach(function (m, i) {
      var b = el('div', 'bubble ' + m.who, m.t);
      if (m.who === 'in' && i >= S.chat.length - S.fresh) b.classList.add('new');
      box.appendChild(b);
    });
    return box;
  }

  function meter(name, val, note) {
    var li = el('li');
    var row = el('div', 'meter-row');
    row.appendChild(el('span', null, name));
    row.appendChild(el('span', null, val + ' / 10'));
    li.appendChild(row);
    var bar = el('div', 'bar'), fill = el('i');
    fill.style.width = (val * 10) + '%';
    bar.appendChild(fill);
    li.appendChild(bar);
    li.appendChild(el('p', 'meter-note', note));
    return li;
  }

  function ending(root) {
    var m = S.m, v;
    if (m.h >= 7 && m.s >= 7) v = 'Mariana ya sabe. Lo que todavía no decide es qué va a hacer con eso.';
    else if (m.s >= 6) v = 'Mariana sospecha. Va a empezar a fijarse en cosas que antes dejaba pasar.';
    else if (m.h >= 5) v = 'Mariana no sospecha de nadie. Solo se siente más chica que ayer.';
    else v = 'Mariana se convenció de que fue un mal día. Por ahora.';

    root.appendChild(el('p', 'pov', 'Fin de la escena 1'));
    root.appendChild(el('h2', 'scene-title', 'Lo que no viste'));
    root.appendChild(el('p', 'verdict', v));

    var ul = el('ul', 'meters');
    ul.appendChild(meter('Confianza', m.c,
      m.c >= 7 ? 'Todavía te cree casi todo.' : m.c >= 4 ? 'Te cree, pero ya revisa lo que dices.' : 'Lo que le digas mañana lo va a comparar con lo de hoy.'));
    ul.appendChild(meter('Sospecha', m.s,
      m.s >= 7 ? 'Ya no se pregunta si pasa algo. Se pregunta desde cuándo.' : m.s >= 4 ? 'Algo no le cuadra y no lo suelta.' : 'Una duda chica, fácil de callar.'));
    ul.appendChild(meter('Humillación', m.h,
      m.h >= 7 ? 'Se sintió de sobra en su propia cena.' : m.h >= 4 ? 'Se quedó con la sensación de haber hecho el ridículo.' : 'Un piquete que casi no nota.'));
    root.appendChild(ul);

    root.appendChild(el('h3', 'sub', 'Lo que Mariana va a recordar'));
    var mem = el('ul', 'memory');
    S.log.forEach(function (l) { mem.appendChild(el('li', null, l)); });
    root.appendChild(mem);
    root.appendChild(el('p', 'reaction', 'En la siguiente escena, ella actúa según esto.'));

    var again = el('button', 'choice go', 'Jugar de nuevo con otras decisiones');
    again.type = 'button';
    again.addEventListener('click', reset);
    var box = el('div', 'choices');
    box.appendChild(again);
    root.appendChild(box);
  }

  function render() {
    var root = document.getElementById('scene');
    root.textContent = '';
    if (S.node === 'end') {
      document.documentElement.setAttribute('data-pov', 'ella');
      document.getElementById('clock').textContent = 'Viernes · 00:02';
      ending(root);
      return;
    }
    var n = NODES[S.node];
    if (n.pov === 'ella') document.documentElement.setAttribute('data-pov', 'ella');
    else document.documentElement.removeAttribute('data-pov');
    document.getElementById('clock').textContent = n.time;

    root.appendChild(el('p', 'pov', n.pov === 'ella' ? 'Desde ella' : 'Desde ti'));
    root.appendChild(el('h2', 'scene-title', n.title));
    if (S.reaction) root.appendChild(el('p', 'reaction', S.reaction));
    n.text().forEach(function (t) { root.appendChild(el('p', null, t)); });
    if (n.phone) root.appendChild(phone());

    var box = el('div', 'choices');
    n.choices.forEach(function (ch) {
      var b = el('button', 'choice' + (ch.go ? ' go' : ''), ch.label);
      b.type = 'button';
      b.addEventListener('click', function () { choose(n, ch); });
      box.appendChild(b);
    });
    root.appendChild(box);
  }

  function reset() {
    S = fresh();
    save();
    render();
    window.scrollTo(0, 0);
  }
  document.getElementById('restart').addEventListener('click', reset);

  function start(data) {
    var saved = data && data.S;
    if (!saved) {
      try { saved = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { saved = null; }
    }
    if (saved && saved.node && saved.m && (saved.node === 'end' || NODES[saved.node])) S = saved;
    render();
  }

  var hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) hot.snapshot(function () { return { S: S }; });
  if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
